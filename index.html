<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gali Kalyan | Fast & Accurate Live Results</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: {
                            300: '#FDE047',
                            400: '#FBBF24',
                            500: '#F59E0B',
                            600: '#D97706',
                            700: '#B45309',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Rajdhani', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .gold-glow {
            box-shadow: 0 0 35px rgba(245, 158, 11, 0.25);
        }
        .text-gradient {
            background: linear-gradient(135deg, #FFF 30%, #FBBF24 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-slate-950 text-white font-sans min-h-screen flex items-center justify-center p-4 selection:bg-gold-500 selection:text-black">

    <!-- Ambient Glowing Background Bubbles -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-32 left-1/2 -translate-x-1/2 w-96 h-96 bg-gold-500/10 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-32 left-1/2 -translate-x-1/2 w-96 h-96 bg-amber-600/10 rounded-full blur-3xl"></div>
    </div>

    <!-- Main Glassmorphism Card Container -->
    <main class="relative z-10 w-full max-w-md bg-slate-900/80 backdrop-blur-xl border border-gold-500/30 rounded-3xl p-8 text-center gold-glow shadow-2xl">
        
        <!-- Sleek Crown Logo Badge -->
        <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-tr from-gold-600 via-gold-400 to-amber-300 text-slate-950 text-4xl font-bold mb-6 shadow-lg shadow-gold-500/20 transform hover:scale-105 transition duration-300">
            <i class="fa-solid fa-crown"></i>
        </div>

        <!-- Brand Name & Tagline -->
        <h1 class="font-display font-extrabold text-3xl sm:text-4xl tracking-wider text-gradient uppercase mb-2">
            Gali Kalyan
        </h1>
        <p class="text-xs sm:text-sm text-gray-300 font-medium mb-8 tracking-wide">
            Fastest & Most Accurate Live Results
            <span class="block text-gold-400 font-semibold mt-1">गली कल्याण  - सबसे तेज़</span>
        </p>

        <!-- Action Buttons -->
        <div class="space-y-4">
            <!-- Primary Live Results Button -->
            <a href="https://galikalyanmatka.com/" target="_blank" class="w-full group flex items-center justify-center gap-3 bg-gradient-to-r from-gold-500 via-gold-400 to-amber-500 hover:from-gold-400 hover:to-gold-600 text-slate-950 font-bold text-base py-3.5 px-6 rounded-xl shadow-lg shadow-gold-500/25 transition-all duration-200 transform hover:-translate-y-0.5">
                <i class="fa-solid fa-bolt text-lg group-hover:animate-bounce"></i>
                <span>Live Results / परिणाम देखें</span>
            </a>

            <!-- Download App / Play Button -->
            <a href="https://galikalyanmatka.com/" target="_blank" class="w-full flex items-center justify-center gap-3 bg-slate-800/90 hover:bg-slate-700/90 text-white font-semibold text-sm py-3.5 px-6 rounded-xl border border-slate-700 hover:border-gold-500/50 transition-all duration-200">
                <i class="fa-solid fa-download text-gold-400 text-base"></i>
                <span>Download App / ऐप डाउनलोड</span>
            </a>
        </div>

        <!-- Minimal Footer Info -->
        <div class="mt-8 pt-4 border-t border-slate-800/80 text-[11px] text-gray-500">
            <p>© 2026 GaliKalyan.com. All Rights Reserved.</p>
        </div>
    </main>

</body>
</html>
